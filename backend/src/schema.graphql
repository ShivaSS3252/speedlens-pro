type Fix {
  language: String
  code: String
  explanation: String
}

type Issue {
  id: ID!
  title: String!
  description: String!
  displayValue: String
  fix: Fix
}

type Suggestion {
  id: ID!
  title: String!
  description: String!
}

type HistoryEntry {
  id: ID!
  mobileScore: Int!
  desktopScore: Int!
  createdAt: String!
}

type Report {
  id: ID!
  url: String!
  mobileScore: Int!
  desktopScore: Int!
  issues: [Issue!]!
  suggestions: [Suggestion!]!
  techStack: String
  createdAt: String!
}

type Query {
  getReport(id: ID!): Report
  getHistory(url: String!): [HistoryEntry!]!
}

type Mutation {
  analyzeWebsite(url: String!): Report!
  generateFix(title: String!, description: String!, displayValue: String, techStack: String!): Fix
}
